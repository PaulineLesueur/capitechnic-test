<main>
    <div class="card" *ngFor="let resa of resaList" (click)="showDialog(resa)">
        <h2>{{ resa.title }}</h2>
        <div class="container">
            <span>{{ resa.date_1 }}</span>
            <span>{{ resa.date_2 }}</span>
        </div>
    </div>
</main>

<p-dialog [(visible)]="visible" [modal]="true" [closable]="true" [position]="'bottom'" [draggable]="false">
    <app-resa-modal [resaToDisplay]="resaData"></app-resa-modal>
</p-dialog>
